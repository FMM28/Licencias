# Uso desde consola (la URL sale de LICENSE_DB_URL, ver migrations/env.py):
#   alembic upgrade head
#   alembic revision --autogenerate -m "descripcion"
#   alembic downgrade -1
#   alembic upgrade head --sql          # solo imprime el SQL (útil para revisarlo antes)
# El CLI del proyecto lo envuelve:  python cli.py db upgrade
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
