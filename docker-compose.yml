services:
  app:
    build: .
    image: license-server:latest
    restart: unless-stopped
    environment:
      LICENSE_DB_URL: ${LICENSE_DB_URL:?Define LICENSE_DB_URL en el .env}
      LICENSE_PRIVATE_KEY_FILE: /data/private.key
      LICENSE_AUTO_MIGRATE: ${LICENSE_AUTO_MIGRATE:-false}
      # El entrypoint de la imagen migra la BD y crea private.key si no existe
      LICENSE_RUN_MIGRATIONS: ${LICENSE_RUN_MIGRATIONS:-true}
    volumes:
      - license_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # El puerto 8000 NO se publica: solo nginx lo alcanza por la red interna.
    expose:
      - "8000"
    # Se sobreescribe el CMD para confiar únicamente en la IP fija de nginx
    # (el valor 127.0.0.1 del Dockerfile no sirve cuando el proxy es otro contenedor).
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.28.0.10
    networks:
      internal: {}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      internal:
        ipv4_address: 172.28.0.10

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - nginx
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Define CLOUDFLARE_TUNNEL_TOKEN en el .env}
    networks:
      internal: {}

volumes:
  license_data:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24